[project]
name = "misiops-mlops"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mlflow>=3.9,<4",
    "numpy==2.4.6",
    "pyyaml>=6.0.2",
    "scikit-learn==1.9.1",
    "scipy==1.17.1",
    "skops==0.13.0",
    "tzdata",
]

[dependency-groups]
dev = ["pytest>=9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../backend"]
