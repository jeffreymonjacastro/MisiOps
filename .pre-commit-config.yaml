# Local secret blocking (FR-009). Run by .githooks/pre-commit (core.hooksPath); needs pre-commit 4.7.0 or uv.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
