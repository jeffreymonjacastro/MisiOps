name: deploy

# Deploys the images scanned by the calling DevSecOps push run.
# develop -> dev (automatic, after the pipeline completes; gates are report-only, EX-001)
# main    -> prod (waits for the required reviewer of the GitHub Environment "prod")
# Contract: specs/012-aws-deployment/contracts/deploy-workflow.md

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.map.outputs.env }}
      deploy: ${{ steps.map.outputs.deploy }}
    steps:
      - id: map
        env:
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$BRANCH" in
            develop) env=dev ;;
            main) env=prod ;;
            *) env= ;;
          esac
          deploy=false
          if [ -n "$env" ] && [ "$EVENT" = push ]; then deploy=true; fi
          echo "env=$env" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH event=$EVENT -> env=${env:-none} deploy=$deploy" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.resolve.outputs.env }}
    concurrency:
      group: deploy-${{ needs.resolve.outputs.env }}
      cancel-in-progress: false
    env:
      ENV_NAME: ${{ needs.resolve.outputs.env }}
      SHA: ${{ github.sha }}
    steps:
      - name: Start timer
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download the scanned images of this DevSecOps run
        uses: actions/download-artifact@v8
        with:
          name: images
          path: images

      - name: Assume the deploy role through OIDC (FR-011)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push the images to ECR tagged with the commit SHA
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          for app in backend frontend; do
            docker load -i "images/$app.tar"
            docker tag "misiops-$app:latest" "$REGISTRY/misiops-$app:$SHA"
            docker push "$REGISTRY/misiops-$app:$SHA"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/misiops-$app:$SHA" | cut -d@ -f2)
            echo "${app}_digest=$digest" >> "$GITHUB_OUTPUT"
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: infra

      - name: cdk deploy MisiOps-${{ needs.resolve.outputs.env }}
        working-directory: infra
        run: |
          pnpm cdk deploy "MisiOps-$ENV_NAME" \
            -c "env=$ENV_NAME" -c "imageTag=$SHA" -c "alertEmail=${{ vars.ALERT_EMAIL }}" \
            --require-approval never --outputs-file outputs.json
          echo "PUBLIC_URL=$(jq -r ".\"MisiOps-$ENV_NAME\".PublicUrl" outputs.json)" >> "$GITHUB_ENV"

      - name: Smoke test (FR-017, NFR-009)
        id: smoke
        run: |
          set -euo pipefail
          bash infra/scripts/smoke.sh "$PUBLIC_URL" | tee smoke.log
          version=$(jq -er .version backend/forecast_release/manifest.json)
          model_hash=$(jq -er .model_sha256 backend/forecast_release/manifest.json)
          manifest_hash=$(sha256sum backend/forecast_release/manifest.json | cut -d' ' -f1)
          served=$(curl -fsS --retry 3 --max-time 10 "$PUBLIC_URL/api/v1/predictions/health" | jq -er .model_version)
          test "$served" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          jq -n --arg version "$version" --arg model "$model_hash" --arg sha "$SHA" \
            --arg manifest "$manifest_hash" --arg image "${{ steps.push.outputs.backend_digest }}" --arg env "$ENV_NAME" \
            '{version:$version,model_sha256:$model,manifest_sha256:$manifest,commit:$sha,image_digest:$image,environment:$env}' > forecast-release.json

      - name: Publish staging verification receipt
        if: needs.resolve.outputs.env == 'dev'
        uses: actions/upload-artifact@v4
        with:
          name: forecast-staging-${{ steps.smoke.outputs.version }}
          path: forecast-release.json
          retention-days: 90

      - name: Summary
        if: always()
        env:
          BACKEND_DIGEST: ${{ steps.push.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.push.outputs.frontend_digest }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          minutes=$(( ($(date +%s) - START) / 60 ))
          {
            echo "## Deployment to \`$ENV_NAME\`"
            echo "- commit: $SHA (DevSecOps run $GITHUB_RUN_ID)"
            echo "- backend digest: \`${BACKEND_DIGEST:-n/a}\`"
            echo "- frontend digest: \`${FRONTEND_DIGEST:-n/a}\`"
            echo "- public URL: ${PUBLIC_URL:-n/a}"
            echo "- smoke test: $SMOKE"
            echo "- duration: ${minutes} min (target: 15 min for updates, 30 min for the first creation)"
          } >> "$GITHUB_STEP_SUMMARY"
