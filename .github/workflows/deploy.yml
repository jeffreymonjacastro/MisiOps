name: deploy

# Deploys the images scanned by the devsecops run that triggered this workflow (specs/012-aws-deployment).
# develop -> dev (automatic, after the pipeline completes; gates are report-only, EX-001)
# main    -> prod (waits for the required reviewer of the GitHub Environment "prod")
# Contract: specs/012-aws-deployment/contracts/deploy-workflow.md

on:
  workflow_run:
    workflows: [devsecops]
    types: [completed]
    branches: [develop, main]

permissions:
  contents: read
  actions: read
  id-token: write

env:
  AWS_REGION: us-east-1

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.map.outputs.env }}
      deploy: ${{ steps.map.outputs.deploy }}
      sha: ${{ github.event.workflow_run.head_sha }}
      run_id: ${{ github.event.workflow_run.id }}
    steps:
      - id: map
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          case "$BRANCH" in
            develop) env=dev ;;
            main) env=prod ;;
            *) env= ;;
          esac
          deploy=false
          if [ -n "$env" ] && [ "$CONCLUSION" = success ] && [ "$EVENT" = push ]; then deploy=true; fi
          echo "env=$env" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH conclusion=$CONCLUSION event=$EVENT -> env=${env:-none} deploy=$deploy" | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ needs.resolve.outputs.env }}
    concurrency:
      group: deploy-${{ needs.resolve.outputs.env }}
      cancel-in-progress: false
    env:
      ENV_NAME: ${{ needs.resolve.outputs.env }}
      SHA: ${{ needs.resolve.outputs.sha }}
    steps:
      - name: Start timer
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Download the scanned images of the triggering devsecops run (FR-009)
        uses: actions/download-artifact@v8
        with:
          name: images
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: images

      - name: Assume the deploy role through OIDC (FR-011)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push the images to ECR tagged with the commit SHA
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          for app in backend frontend; do
            docker load -i "images/$app.tar"
            docker tag "misiops-$app:latest" "$REGISTRY/misiops-$app:$SHA"
            docker push "$REGISTRY/misiops-$app:$SHA"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/misiops-$app:$SHA" | cut -d@ -f2)
            echo "${app}_digest=$digest" >> "$GITHUB_OUTPUT"
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: infra/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: infra

      - name: cdk deploy MisiOps-${{ needs.resolve.outputs.env }}
        working-directory: infra
        run: |
          pnpm cdk deploy "MisiOps-$ENV_NAME" \
            -c "env=$ENV_NAME" -c "imageTag=$SHA" -c "alertEmail=${{ vars.ALERT_EMAIL }}" \
            --require-approval never --outputs-file outputs.json
          echo "PUBLIC_URL=$(jq -r ".\"MisiOps-$ENV_NAME\".PublicUrl" outputs.json)" >> "$GITHUB_ENV"

      - name: Smoke test (FR-017, NFR-009)
        id: smoke
        run: bash infra/scripts/smoke.sh "$PUBLIC_URL" | tee smoke.log

      - name: Summary
        if: always()
        env:
          BACKEND_DIGEST: ${{ steps.push.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ steps.push.outputs.frontend_digest }}
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          minutes=$(( ($(date +%s) - START) / 60 ))
          {
            echo "## Deployment to \`$ENV_NAME\`"
            echo "- commit: \`$SHA\` (devsecops run ${{ needs.resolve.outputs.run_id }})"
            echo "- backend digest: \`${BACKEND_DIGEST:-n/a}\`"
            echo "- frontend digest: \`${FRONTEND_DIGEST:-n/a}\`"
            echo "- public URL: ${PUBLIC_URL:-n/a}"
            echo "- smoke test: $SMOKE"
            echo "- duration: ${minutes} min (target: 15 min for updates, 30 min for the first creation)"
          } >> "$GITHUB_STEP_SUMMARY"
